<!DOCTYPE html>
<html>
<head>
<style>
    ul{
        list-style: none;
        padding:0;
        margin:0;
    }
    ul li{
        display:block;
        float:left;
    }
    li ul{
        display: none;
    }
    ul li a{
         display: block;
      font-family:helvetica;
      font-size:20px;
      background-color:deepskyblue;
      padding: 10px;
      text-decoration: none;
      color: black;
      width:100px; 
      border: 2px solid black;
      border-radius:5%;
    }
    ul li a:hover{
        background-color: deepskyblue;
        color:white;
    }
    li:hover ul{
        display: block;
        position:absolute;
    }
    li:hover li{
        float:none;

    }
    li:hover a{
        background-color: pink;
        color:black;
    }
    li:hover li a:hover{
        width:100px;
    }

    </style>
</head>
<body>
<h3> example for drop down  horizontal menu</h3>
<ul>
    <li><a href="#fruits"">Fruits</a>
     <ul>
        <li><a href="#apple"> Apple</a></li>
        <li><a href="#mango"> Mango</a></li>
        <li><a href="#papaya">Papaya</a></li>
        <li><a href="#banana">Banana</a></li>
     </ul></li>
     <li><a href="#flowers"> Flowers</a>
     <ul>
        <li><a href="#rose">Rose</a></li>
        <li><a href="#lilly">Lilly</a></li>
        <li><a href="#marigold">Marigold</a></li>
        <li><a href="#sunflower">Sunflower</a></li>
     </ul></li>
     <li><a href="#vegitables">Vegitables</a>
     <ul>
        <li><a href="#potato">potato</a></li>
        <li><a href="#onion">Onion</a></li>
        <li><a href="#carrot">Carrot</a></li>
        <li><a href="#brinjal">Brinjal</a></li>
     </ul></li>
</ul>

</body>
</html>
