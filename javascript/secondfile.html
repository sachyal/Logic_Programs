<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>

    <script>
        function fe(){
            alert("Cursor gets in UI");
            console.log("on focus");
        }
        function ce(){
            alert("UI element client");
            console.log("click event");
        }
        function be(){
            alert("cursor out of UI");
            console.log("blurr");
        }

        function add(){
            alert("add");
            console.log("add on focus");
        }
         function sub(){
            alert("sub");
            console.log("sub on focus");
        }
         function multi(){
            alert("multi");
            console.log("multi on focus");
        }
         function div(){
            alert("divider");
            console.log("divide on focus");
        }
        function subm1(){
            alert("Submitted");
            console.log("submit of focus");
        }
       

    </script>
</head>
<body>

<!--<input type="button" value="Click Me" onclick="ce()" onblur="be()" onfocus="fe()" /> -->
<input type="button" value="add"  onfocus="add()"; onclick="ce()"; onblur="be()"; />
<input type="button" value="sub"  onfocus="sub()"; onclick="ce()"; onblur="be()"; />
<input type="button" value="multi"  onfocus="multi()"; onclick="ce()"; onblur="be()"; />
<input type="button" value="div"  onfocus="div()"; onclick="ce()"; onblur="be()"; />

<form action="#action.php">
    <label for="name">Name:</label>

     <label for="d1">Data:</label>
