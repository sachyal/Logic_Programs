<!DOCTYPE html>
<html>
  <head> <title>pagination with transition effect</title>
    <style>
     .pagination-border a{
       display:inline-block;
       color: hotpink;
       font-size:1.5em;
       padding: 16px;
       background:#F5F2F2;
       border:2px solid hotpink;
       text-decoration: none;
       transition: background-color .6s;
     }
	 
     .pagination-border a:hover{
       background-color:hotpink;
       color:white;
     }
    </style>
  </head>
  <body>
    <section class="pagination-border">
      <a href="#">«</a>
      <a href="#">1</a>
      <a href="#">2</a>
      <a href="#">3</a>
      <a href="#">4</a>
      <a href="#">5</a>
      <a href="#">»</a>
    </section>
  </body>
</html>
