<!DOCTYPE html>
<html>
    <head> <title>Side bar</title>
        <meta charset="UTF-8">
        <meta type="viewport" content="width=device-width initial-scale:1.0">
        <style>
            .sidebarnav{
                height:100%;
                width:160px;
                left: 0;
                top:0;
                position: fixed;
                overflow-x: hidden;
                padding-top: 10px;
                background-color: black;

            }
            .sidebarnav a{
                display: block;
                font-size: 20px;
                color: red;
                text-decoration: none;
                padding: 10px 16px;
            }
            .sidebarnav a:hover{
                color: white;
                
            }
            .main{
                margin-left: 160px;
                padding: 0px 10px;
            }
        </style>
    </head>
    <body>
        <div class="sidebarnav">
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#carrers"> Carrers</a>
            <a href="#contact"> Contact</a>
        </div>
        <div class="main">
            <h1> main content</h1>
        </div>
    </body>
</html>
