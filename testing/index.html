<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
<main class="page-content">
    <section class="registration-overview">
        <div class="registration-text">
            <h3><span class="regis-icon"><i class="fa-solid fa-chart-line"></i></span>REGISTRATION 0VERVIEW
            <span class="regis-icon2"><i class="fa-solid fa-question"></i></span></h3>
        </div>
        <div class="registration-text2">
            <div>
                <h3>REGISTRATION OVERVIEW 2026 <span class="regis-year">2026</span></h3>
            </div>
        </div>

    </section>
    <section class="card-wrapper">
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-computer"></i></div>
            <div class="card-text">
                <h1>285</h1>
                <p>Total Reg<i class="fa-solid fa-exclamation"></i></p>
                <p style="color:aqua";><i class="fa-solid fa-users"></i> 374 attendees</p>
                <div class="card-meter"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-pencil"></i></div>
            <div class="card-text">
                <h1 style="color:green";>266</h1>
                <p>paid this year<i class="fa-solid fa-exclamation"></i></p>
                <p style="color:aqua";><i class="fa-solid fa-users"></i> 352 attendees</p>
                <div class="card-meter"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-regular fa-file"></i></div>
            <div class="card-text">
                <h1 style="color:rgb(146, 37, 37)";>20</h1>
                <p>UnPaid<i class="fa-solid fa-exclamation"></i></p>
                <p style="color:aqua";><i class="fa-solid fa-users"></i> 22 attendees</p>
                <div class="card-meter"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-note-sticky"></i></div>
            <div class="card-text">
                <h1 style="color:yellow";>2</h1>
                <p>Pending<i class="fa-solid fa-exclamation"></i></p>
                <p style="color:aqua";><i class="fa-solid fa-users"></i> 2 attendees</p>
                <div class="card-meter"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-regular fa-calendar"></i></div>
            <div class="card-text">
                <h1 style="color:lightseagreen";>0</h1>
                <p>Paid This Week<i class="fa-solid fa-exclamation"></i></p>
                <p style="color:aqua";><i class="fa-solid fa-users"></i> </p>
                <div class="card-meter"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="card-text">
                <h1 style="color:rgba(198, 32, 198, 0.489)";>0</h1>
                <p>Paid Today<i class="fa-solid fa-exclamation"></i></p>
                <p style="color:aqua";><i class="fa-solid fa-users"></i> </p>
                <div class="card-meter"></div>
            </div>
        </div>
    </section>
</main>
    
</body>
</html>
