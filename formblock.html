<html>
<head>
<meta name = "viewport" content = "width = device-width, initial-scale = 1">  
  <style>
   #form1, #form2 {
    width:50%;
   }   
   #form1 input {
    width:100%;
    padding: 10px;
    margin:5px;
    border:2px solid black;
    box-shadow: 0 10px 10px rgba(0,0,0,0.22);
   }
   
   #form2 input {
    display:block;
    padding: 10px;
    margin:5px;
    border:2px solid black;
    box-shadow: 0 10px 10px rgba(0,0,0,0.22);
   }
  </style>
  </head>
  <body>
    <h3>CSS Stacked Form using width property</h3>
      <form id="form1">
        <label>Name</label>
        <input type="text" name="name" placeholder="Full Name">
        <label>Email</label>
        <input type="email" name="mailid" placeholder="Enter your gmail">
        <label>Phone </label><span> (Format: 123-45-678)</span>
        <input type="tel" name="mobile" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" placeholder="Mobile Number">
      </form>
	<h3>CSS Stacked Form using display property</h3>
      <form id="form2">
        <label>User id</label>
        <input type="text" name="user">
        <label>Password</label>
        <input type="password" name="password">
      </form>	  
  </body>
</html>
