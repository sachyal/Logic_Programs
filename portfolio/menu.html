<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width ,initial-scale:1.0">
        <title>hamburger_menu</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
           
    <style>
            body{
                background-color: aquamarine;
                margin: 0;
                padding: 0;
                 background-color: rgba(235,235,242);
                 width: 100%;
                 height: 100vh;
                box-sizing: border-box;
                font-family: "poppins";
                background-color: aqua;
            }
            .center{
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }
            .menu{
                width: 100%;
                height: fit-content;
                display: flex;
                align-items:center;
                color:white;
                background-color: rgb(37,38,53);
                justify-content: space-between;
            }
            .logo{
                width: fit-content;
                font-size: 32px;
                color:white;
                font-weight: 600;
                padding:15px;
                display: flex;
                align-items: center;
                justify-content: space-between;


            }
         #menu{
            display: none;
         }
         .items{
            width: fit-content;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;

         }
         .item{
            color:white;
            width:100%;
            padding:10px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5mm;
            text-decoration:none;
         }
         .item:hover{
            background-color: rgba(255,255,255,0.5);
         }
        
        @media screen and (max-width: 650px){
            .menu{
                flex-direction: column;
            }
            .menu .logo{
                width: 100%;
                display: flex;
                box-sizing:border-box;
                justify-content: space-between;

            }
         .menu .logo label{
            display: block;
            cursor:pointer;
            width:30px;
            height: 30px;

         }
            .menu .logo label::before {
            content: "\f0c9"; /* fa-bars (hamburger) */
            font-family: "Font Awesome 6 Free";
            font-weight: 900; /* solid style */
            font-size: 24px;
            }
         .menu .items{
            width:100%;
            flex-direction: column;
            max-height: 0;
            overflow: hidden;
            transition:max-height 0.25s ease-in-out;
         }
         .menu .item{
            width: 100%;
            border-top:0.5mm solid rgb(52,53,71);
         }
         #menu:checked ~ .items{
            max-height: 500px;

         }
         
            #menu:checked ~ .logo label::before {
            content: "\f00d"; /* fa-xmark (close) */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            }

        }



        </style>
    </head>
    <body>
        <div class="center">
            <div class="menu">
                Hello this new page menu
                <input type="checkbox" name="" id="menu">
                <div class="logo">LOGO 
                  <label for="menu"></label>
                </div>
                <div class="items">
                   <a href="" class="item">HOME</a>
                   <a href="" class="item">About</a>
                   <a href="" class="item">Feature</a>
                   <a href="" class="item">Profile</a>
                   <a href="" class="item">Logout</a>
                </div>
            </div>
        </div>
    </body>
</html>
