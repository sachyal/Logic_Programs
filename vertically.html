<!DOCTYPE html>
<html>
    <head>
        <title>vertically drop down</title>
        <style>
            <style>
     * {
      padding:0;
      margin:0;
     }
	  
     div.dropdown-vertically {
      position:relative;
      width:200px;
     }
	 
     div.dropdown-vertically ul {
      list-style: none;
      background-color:lightgreen;
      font-size:20px;
     }
	 
     div.dropdown-vertically li {
      position:relative;
      border:2px solid black;
     }
	 
     div.dropdown-vertically a { 
      display:block;
      text-decoration:none;
      padding:10px;
      color:black;
     }
	
     div.dropdown-vertically li:hover > a {
      background:black;
      color:lightgreen;
     }
	 
     div.dropdown-vertically ul ul {
      position:absolute;
      top:0;
      width:100%;
      visibility:hidden;
     }
	 
     div.dropdown-vertically li:hover > ul {
      left:100%;
      visibility:visible;
     }

        </style>
    </head>
    <body>
        <h3> example for vertically drop down menu</h3>
        <div class="dropdown-vertically">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#ser">Services</a>

                <li><a href="#webdevelopmen">Web Development</a></li>
                <li><a href="#videoediting"> Video editing</a></li>
            </ul></li>
            <li><a href="#">Courses</a>

                <li><a href="#html">HTML</a></li>

            </uL></li>
            <li><a href="#">About us</a></li>
        </ul>
        </div>
    </body>
</html>
